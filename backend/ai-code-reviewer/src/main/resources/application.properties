
# Application
spring.application.name=ai-code-reviewer
server.port=${PORT:8080}

# Aiven MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_code_reviewer_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SSL configuration for Aiven MySQL
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# LM Studio
lmstudio.base-url=${LMSTUDIO_BASE_URL:http://localhost:1235/v1}
lmstudio.model=${LMSTUDIO_MODEL:qwen2.5-coder-1.5b-instruct}
lmstudio.temperature=0.1
lmstudio.max-tokens=4096

# Request Limits
chat.max-input-characters=2000
chat.requests-per-minute=10

# Cache
chat.cache-ttl-seconds=600

# Image Generation
image.mock-mode=true
openai.api-key=${OPENAI_API_KEY:}
openai.image-model=gpt-image-1-mini

# Speech-to-Text
speech.mock-mode=true
openai.transcription-model=gpt-transcribe

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
